# Static infrastructure. Brokers (old io-*, new nv-*, tmp-1, spares) are started by
# scripts/broker.sh with `docker run` on this network, so each swap creates only what it needs.
name: rpbr

networks:
  rpnet:
    name: rpnet
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25   # dynamic IPs (client/tool containers) stay clear of static ones

volumes:
  minio-data:
    name: rpbr-minio-data

services:
  coredns:
    image: coredns/coredns:1.12.4
    container_name: rp-coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns:/etc/coredns:ro
    networks:
      rpnet:
        ipv4_address: 172.30.0.53
    mem_limit: 64m
    restart: unless-stopped

  minio:
    image: rpbr/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: images/minio
      target: minio
      args:
        MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
        MC_TAG: RELEASE.2025-08-13T08-35-41Z
    container_name: rp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rpminio
      MINIO_ROOT_PASSWORD: rpminio-secret-key
    volumes:
      - minio-data:/data
    networks:
      rpnet:
        ipv4_address: 172.30.0.10
    dns: [172.30.0.53]
    mem_limit: 1g
    restart: unless-stopped

  mc-init:
    image: rpbr/mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: images/minio
      target: mc
      args:
        MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
        MC_TAG: RELEASE.2025-08-13T08-35-41Z
    container_name: rp-mc-init
    environment:
      MC_HOST_local: http://rpminio:rpminio-secret-key@minio.rp.test:9000
    command: ["mb", "--ignore-existing", "local/redpanda-ts"]
    depends_on: [minio]
    networks: [rpnet]
    dns: [172.30.0.53]
    restart: "no"
